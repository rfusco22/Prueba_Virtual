<script type="text/javascript">
  $(".block2-btn-addcart").each(function() {
    var nameProduct = $(this)
      .parent()
      .parent()
      .parent()
      .find(".block2-name")
      .html();
    $(this).on("click", function() {
      swal(nameProduct, "is added to cart !", "success");
    });
  });
</script>

<script type="text/javascript">
document.addEventListener('DOMContentLoaded', function() {
    const shippingForm = document.querySelector('.needs-validation');
    if (shippingForm) { // <--- PROTECCIÓN CONTRA NULL
        shippingForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const zipInput = shippingForm.querySelector('input[name="zip"]');
            if (zipInput && zipInput.value.trim()) {
                window.location.href = window.location.pathname + '?zip=' + encodeURIComponent(zipInput.value.trim());
            }
        });
    }
});
</script>
